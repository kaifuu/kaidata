# 大数据平台 - 大数据组件编排
# 现代湖仓栈：MinIO(湖存储) + Iceberg REST Catalog(湖格式) + Kafka(总线) + Flink(流) + StarRocks(数仓, Doris 同源)
# Spark 按需 spark-submit 提交，不常驻（省内存）。
# 启动：docker compose up -d
#
# 说明：仓库用 StarRocks 替代 Doris（两者同源、同 MySQL 协议 9030、同 SQL 方言），
#       因 apache/doris 镜像在镜像源不可用且 BE 需调 max_map_count，StarRocks allin1 更稳。
#
# 网络：容器间用服务名（kafka:9092 / starrocks:9030 / minio:9000）；
#       宿主机用 localhost + 映射端口（Kafka 9094 / StarRocks 9030 / MinIO 9000）。
#
# 固定工程名 → 网络名恒为 pharma-bigdata_default（与 init 脚本、README、
# spark-submit 的 --network=pharma-bigdata_default 一致）。
# 不设 name 时，网络名随调用目录漂移（曾实测为 docker_default），导致命令失配。
name: pharma-bigdata
services:
  # ---------- 湖存储 ----------
  minio:
    image: minio/minio:latest
    container_name: pharma-minio
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes: [minio-data:/data]
    mem_limit: 512m

  # ---------- Iceberg REST Catalog（湖格式目录服务，8181）----------
  # 元数据 JdbcCatalog(sqlite) 落卷持久化；数据文件落 MinIO s3://lake/wh（桶由 bring-up.sh 建）。
  # StarRocks 经 External Catalog 读湖表（init/iceberg-catalog.sql）；后端 iceberg-java 直写。
  # 基于 tabulario/iceberg-rest 本地构建 S3 增强版（原镜像缺 iceberg-aws，服务端建表写不了 s3://）。
  iceberg-rest:
    build: ./iceberg-rest-aws
    image: pharma-iceberg-rest-aws:latest
    container_name: pharma-iceberg-rest
    ports: ["8181:8181"]
    environment:
      CATALOG_WAREHOUSE: s3://lake/wh
      # 镜像 env 映射规则：去 CATALOG_ 前缀后 __→-、_→.，故 io-impl 须写成 CATALOG_IO__IMPL
      # （写 CATALOG_IO_IMPL 会映射成无效键 io.impl，服务端建表退回 HadoopFileIO 报 s3:// 无 FileSystem）
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      # S3FileIO 的属性须进 catalog 属性映射（AWS_* 环境变量只喂 SDK 默认链，不含 endpoint）：
      # CATALOG_S3_ENDPOINT→s3.endpoint、CATALOG_S3_ACCESS__KEY__ID→s3.access-key-id（__→-）
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_ACCESS__KEY__ID: minioadmin
      CATALOG_S3_SECRET__ACCESS__KEY: minioadmin
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      REST_IO_IMPL: org.apache.iceberg.aws.s3.S3FileIO
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_ENDPOINT: http://minio:9000
      S3_ENDPOINT: http://minio:9000
      AWS_S3_PATH_STYLE_ACCESS: "true"
      CATALOG_JDBC_URL: jdbc:sqlite:/var/lib/iceberg/catalog.db
    mem_limit: 768m
    volumes: [iceberg-meta:/var/lib/iceberg]

  # ---------- 数据总线（Apache 官方 Kafka，KRaft 无 Zk）----------
  kafka:
    image: apache/kafka:3.7.0
    container_name: pharma-kafka
    ports: ["9094:9094"]   # 宿主机经 EXTERNAL listener 访问
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"   # KRaft 必须，base64 任意
    mem_limit: 1g

  # ---------- 流计算 Flink ----------
  flink-jm:
    image: flink:1.18-java17
    container_name: pharma-flink-jm
    ports: ["8081:8081"]
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jm
        taskmanager.numberOfTaskSlots: 4
        rest.port: 8081
    volumes: [flink-jobs:/opt/flink/usrlib]
    mem_limit: 512m

  flink-tm:
    image: flink:1.18-java17
    container_name: pharma-flink-tm
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jm
        taskmanager.numberOfTaskSlots: 4
    depends_on: [flink-jm]
    volumes: [flink-jobs:/opt/flink/usrlib]
    mem_limit: 768m

  # ---------- Flink SQL Gateway（离线 FlinkSQL/FlinkDag 作业提交入口，8083）----------
  flink-sql-gateway:
    image: flink:1.18-java17
    container_name: pharma-flink-sql-gateway
    ports: ["8083:8083"]
    command:
      - /bin/bash
      - -c
      - |
        /opt/flink/bin/sql-gateway.sh start -Drest.address=flink-jm -Drest.port=8081 -Dsql-gateway.endpoint.rest.address=0.0.0.0 -Dsql-gateway.endpoint.rest.port=8083
        sleep 15
        echo '=== log dir ==='; ls /opt/flink/log/ 2>&1
        echo '=== sql-gateway log ==='; tail -n 40 /opt/flink/log/sql-gateway-*.log 2>/dev/null || echo '(no sql-gateway log)'
        sleep infinity
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jm
        rest.address: flink-jm
        rest.port: 8081
        sql-gateway.endpoint.rest.address: 0.0.0.0
        sql-gateway.endpoint.rest.port: 8083
    depends_on: [flink-jm]
    mem_limit: 512m

  # ---------- Apache Hop Server（离线 Kettle/Hop 作业执行，8082→容器8080）----------
  hop-server:
    image: apache/hop:2.10.0
    container_name: pharma-hop
    ports: ["8082:8080"]
    environment:
      HOP_USER: cluster
      HOP_PASS: cluster
    volumes:
      - ./hop-jdbc/mysql-connector-j-8.3.0.jar:/opt/hop/lib/jdbc/mysql-connector-j-8.3.0.jar:ro
      - ./hop-output:/opt/hop/output
    mem_limit: 2g

  # ---------- 实时数仓 StarRocks（FE+BE allin1，MySQL 协议 9030）----------
  # AWS_REGION/AK/SK：Iceberg External Catalog 内部 SDK 走默认链（环境变量是其中一环；
  # catalog 属性 aws.s3.* 对 rest 型 catalog 不喂给数据文件读取的 S3 客户端，
  # 缺 region 报 Unable to load region、缺 AK/SK 报 Unable to load credentials）。
  starrocks:
    image: starrocks/allin1-ubuntu:3.3.10
    container_name: pharma-starrocks
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "8030:8030"   # FE Web
      - "9030:9030"   # MySQL 协议（服务层/Flink/Spark 查询入口）
    mem_limit: 3g
    # allin1 实际装在 /data/deploy/starrocks（fe/meta、be/storage 都在其下）；
    # 曾误挂 /opt/starrocks（镜像里是空目录，等于没挂 → External Catalog 随容器重建丢失）。
    # 卷名换 sr-home（新卷首挂自动拷入镜像内容；旧 sr-data 卷为空可手动清理）
    volumes: [sr-home:/data/deploy/starrocks]

volumes:
  minio-data:
  flink-jobs:
  sr-home:
  iceberg-meta:
